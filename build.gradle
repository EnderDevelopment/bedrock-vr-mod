plugins {
    id 'java'
    id 'maven-publish'
}

group 'com.just1gaming321'
version '1.0'

repositories {
    mavenCentral()
    maven {
        url 'https://maven.minecraftforge.net'
    }
}

dependencies {
    implementation fg.deobf('net.minecraftforge:forge:1.21.4-49.0.2')
    implementation 'net.minecraftforge:minecraft:1.21.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.21.4'
}

jar {
    archiveFileName = "bedrockvrmod-" + version + ".jar"
}
